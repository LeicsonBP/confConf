name: db-test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg:
    name: migrações e pgTAP (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Subir Supabase local
        run: supabase start

      - name: Aplicar migrações e seed
        run: supabase db reset

      - name: Testes de banco (pgTAP)
        run: supabase test db
